name: Atualizar looks da arara

on:
  schedule:
    - cron: "0 9 * * *"   # todo dia às 06:00 de Brasília (09:00 UTC)
  workflow_dispatch:       # botão "Run workflow" para rodar na hora

permissions:
  contents: write

concurrency:
  group: atualizar-looks
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Buscar posts novos no Behold
        env:
          BEHOLD_FEED_URL: ${{ secrets.BEHOLD_FEED_URL }}
        run: node scripts/atualizar-looks.mjs

      - name: Salvar mudanças
        run: |
          git add assets/looks
          if git diff --cached --quiet; then
            echo "Sem mudanças."
          else
            git config user.name "robo-da-arara"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Atualiza looks da arara"
            git push
          fi
